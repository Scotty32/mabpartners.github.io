services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: mabpartners-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules/
      - /var/www/html/vendor/
      - dev_storage_framework:/var/www/html/storage/framework
      - dev_storage_logs:/var/www/html/storage/logs
      - /var/www/html/bootstrap/cache/
    depends_on:
      - db
    networks:
      - mabpartners-net
    environment:
      APP_ENV: local
      VITE_HOST: 0.0.0.0
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-mabpartners}
      DB_USERNAME: ${DB_USERNAME:-mabpartners_user}
      DB_PASSWORD: ${DB_PASSWORD:-mabpartners}
    ports:
      - "5174:5173"

  nginx:
    image: nginx:alpine
    container_name: mabpartners-nginx
    restart: unless-stopped
    volumes:
      - .:/var/www/html:ro
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - mabpartners-net
    ports:
      - "8081:80"

  db:
    image: mariadb:10.9.2
    container_name: mabpartners-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-mabpartners}
      MYSQL_DATABASE: ${DB_DATABASE:-mabpartners}
      MYSQL_USER: ${DB_USERNAME:-mabpartners_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mabpartners}
    volumes:
      - db_data:/var/lib/mysql
      - ./.docker/db/init:/docker-entrypoint-initdb.d
      - ./.docker/db/my.cnf:/etc/mysql/my.cnf
    networks:
      - mabpartners-net

volumes:
  db_data:
  # storage/framework (vues compilees, cache, sessions) et storage/logs sont
  # isoles du bind-mount Windows : sous WSL2, les fichiers montes depuis C:\
  # apparaissent toujours root:root et chown/chmod n'ont aucun effet (limitation
  # DrvFs), donc le worker php-fpm (www-data) ne peut pas y ecrire — ce qui
  # faisait echouer la compilation des vues Blade (tempnam() retombe sur le tmp
  # systeme). Un volume nomme normal (vrai filesystem Linux) resout le probleme.
  # storage/app reste dans le bind-mount classique : lecture seule suffit pour
  # servir les images de terrains commitees dans le repo, et la lecture via
  # DrvFs fonctionne normalement (seule l'ecriture est cassee).
  dev_storage_framework:
  dev_storage_logs:

networks:
  mabpartners-net:
    driver: bridge
