services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: mabpartners-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules/
      - /var/www/html/vendor/
      - dev_storage:/var/www/html/storage
      - /var/www/html/bootstrap/cache/
    depends_on:
      - db
    networks:
      - mabpartners-net
    environment:
      APP_ENV: local
      VITE_HOST: 0.0.0.0
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-mabpartners}
      DB_USERNAME: ${DB_USERNAME:-mabpartners_user}
      DB_PASSWORD: ${DB_PASSWORD:-mabpartners}
    ports:
      - "5174:5173"

  nginx:
    image: nginx:alpine
    container_name: mabpartners-nginx
    restart: unless-stopped
    volumes:
      - .:/var/www/html:ro
      - dev_storage:/var/www/html/storage:ro
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - mabpartners-net
    ports:
      - "8081:80"

  db:
    image: mariadb:10.9.2
    container_name: mabpartners-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-mabpartners}
      MYSQL_DATABASE: ${DB_DATABASE:-mabpartners}
      MYSQL_USER: ${DB_USERNAME:-mabpartners_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mabpartners}
    volumes:
      - db_data:/var/lib/mysql
      - ./.docker/db/init:/docker-entrypoint-initdb.d
      - ./.docker/db/my.cnf:/etc/mysql/my.cnf
    networks:
      - mabpartners-net

volumes:
  db_data:
  # storage/ est isole du bind-mount Windows (contrairement au reste du repo) :
  # sous WSL2, les fichiers montes depuis C:\ apparaissent toujours root:root et
  # chown/chmod n'ont aucun effet (limitation DrvFs), donc le worker php-fpm
  # (www-data) ne peut pas y ecrire — ce qui fait echouer la compilation des
  # vues Blade (tempnam() retombe sur le tmp systeme). Un volume nomme normal
  # (vrai filesystem Linux) resout le probleme ; partage avec nginx pour qu'il
  # puisse aussi servir les fichiers uploades via le lien public/storage.
  dev_storage:

networks:
  mabpartners-net:
    driver: bridge
