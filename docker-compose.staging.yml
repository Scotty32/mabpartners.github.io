services:
  nginx:
    image: nginx:alpine
    container_name: mabpartners-nginx-staging
    restart: unless-stopped
    volumes:
      - app_public:/var/www/html/public
      - app_storage:/var/www/html/storage:ro
      - ./.docker/nginx/dokploy.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - dokploy-network
    expose:
      - "80"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mabpartners-app:latest
    container_name: mabpartners-app-staging
    restart: unless-stopped
    env_file: .env.staging
    working_dir: /var/www/html
    volumes:
      - app_storage:/var/www/html/storage
      - app_bootstrap:/var/www/html/bootstrap/cache
      - app_public:/var/www/html/public
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
    networks:
      - dokploy-network
    expose:
      - "9000"

networks:
  dokploy-network:
    external: true

volumes:
  app_storage:
  app_bootstrap:
  app_public:
